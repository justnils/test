<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallo Welt</title>
  <meta name="description" content="Eine kleine Hallo-Welt-Website.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="wave" aria-hidden="true">👋</p>
    <h1 id="greeting">Hallo Welt</h1>
    <p class="subtitle">Eine kleine Website, die freundlich Guten Tag sagt.</p>

    <form id="name-form" autocomplete="off">
      <label for="name-input">Wie heißt du?</label>
      <div class="row">
        <input id="name-input" name="name" type="text" placeholder="Dein Name" maxlength="40">
        <button type="submit">Begrüßen</button>
      </div>
    </form>

    <p class="time" id="clock"></p>
  </main>

  <footer>
    <button type="button" id="theme-toggle" aria-pressed="false">Dunkles Design</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
